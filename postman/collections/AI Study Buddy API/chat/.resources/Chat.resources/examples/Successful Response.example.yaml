$kind: http-example
request:
  url: "{{baseUrl}}/chat"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "question": "string",
        "session_id": null
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "session_id": "string",
        "answer": "string",
        "sources": [
          "string",
          "string"
        ],
        "provider": null
      }
    $type: |-
      {
        "title": "ChatResponse",
        "type": "object",
        "properties": {
          "session_id": {
            "type": "string",
            "title": "Session Id"
          },
          "answer": {
            "type": "string",
            "title": "Answer"
          },
          "sources": {
            "type": "array",
            "title": "Sources",
            "items": {
              "type": "string"
            }
          },
          "provider": {
            "title": "Provider",
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "session_id",
          "answer",
          "sources"
        ]
      }
order: 1000
