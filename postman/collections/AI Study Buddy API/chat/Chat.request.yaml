$kind: http-request
description: Ask a question. Answers come from your indexed notes, with sources.
url: http://127.0.0.1:8000/chat
method: GET
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "question": "What is a decorator in Python?"
    }
settings: {}
examples: ./.resources/Chat.resources/examples
order: 1000
